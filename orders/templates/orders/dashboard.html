{% extends 'orders/base.html' %}
{% load static %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<div class="history-header">
    <h2 id="dashboard-title">Today's Summary</h2>
    <div class="history-filters">
        <label>Period
            <select id="filter-period">
                <option value="today">Today</option>
                <option value="month">This Month</option>
                <option value="all">All Time</option>
            </select>
        </label>
    </div>
</div>
<div class="stat-cards">
    <div class="stat-card">
        <span class="stat-label">Total Orders</span>
        <span class="stat-value" id="stat-total-orders">-</span>
    </div>
    <div class="stat-card">
        <span class="stat-label">Total Revenue</span>
        <span class="stat-value" id="stat-total-revenue">-</span>
    </div>
    <div class="stat-card">
        <span class="stat-label">Pending</span>
        <span class="stat-value" id="stat-pending">-</span>
    </div>
    <div class="stat-card">
        <span class="stat-label">In Progress</span>
        <span class="stat-value" id="stat-in-progress">-</span>
    </div>
    <div class="stat-card">
        <span class="stat-label">Completed</span>
        <span class="stat-value" id="stat-completed">-</span>
    </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script src="{% static 'js/dashboard.js' %}"></script>
{% endblock %}
