{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Biryani Boss POS</title>
<link rel="manifest" href="{% static 'manifest.json' %}">
<meta name="theme-color" content="#7a1414">
<link rel="apple-touch-icon" href="{% static 'icons/icon-180.png' %}">
<link rel="icon" href="{% static 'icons/icon-32.png' %}">
<link rel="stylesheet" href="{% static 'css/pos.css' %}">
</head>
<body class="login-body" style="background-image: url('{% static 'images/login-bg.jpeg' %}');">
<div class="login-overlay"></div>
<div class="login-box">
    <div class="login-brand">Biryani Boss</div>
    <div class="login-subtitle">Point of Sale</div>
    {% if form.errors %}
        <p class="error-text">Invalid username or password.</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <label>Username</label>
        <input type="text" name="username" autofocus required>
        <label>Password</label>
        <input type="password" name="password" required>
        <button type="submit">Log In</button>
    </form>
</div>
</body>
</html>
